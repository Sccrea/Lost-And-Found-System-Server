<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>失物招领</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f5f5;padding:30px;}
        .title{text-align:center;margin-bottom:30px;color:#333}
        #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;}
        .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .card img{width:100%;height:200px;object-fit:cover;border-radius:8px;margin-top:12px}
        .card p{margin:8px 0;color:#666}
    </style>
</head>
<body>
    <h1 class="title">失物招领列表</h1>
    <div id="list">加载中...</div>

    <script>
        // 只加载一次！绝对不刷新！
        window.addEventListener('DOMContentLoaded', async function() {
            const list = document.getElementById('list');
            try {
                const res = await fetch("/get_data");
                const data = await res.json();
                list.innerHTML = "";

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "card";

                    const item_type = item.item_type || "无物品";
                    const locker_id = item.locker_id || "无柜号";
                    const photo_name = item.photo_name || "";

                    // 🔥 正确图片路径
                    div.innerHTML = `
                        <h3>${item_type}</h3>
                        <p>柜号：${locker_id}</p>
                        <img src="/images/${photo_name}" alt="物品图片">
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = "加载失败：" + e.toString();
                console.error(e);
            }
        });
    </script>
</body>
</html>
